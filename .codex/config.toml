#:schema https://developers.openai.com/codex/config-schema.json
# Project settings for Codex. Loaded only after you trust this project in Codex.
# Written from the Codex documentation (0.167, November 2026) and NOT yet run under Codex:
# check it with `codex` in this folder and adjust.
#
# A model provider cannot be chosen here: Codex ignores `model_provider` and `model_providers`
# in project config. See docs/model-routes.md in tackroom for the launcher approach.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

# By default Codex passes variables whose names contain KEY, SECRET or TOKEN through to the
# commands it runs. Turn that off so a command cannot pick up API keys from the environment.
[shell_environment_policy]
ignore_default_excludes = false
