name: Bug report
description: Something in Truing doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem, please report it privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. Error text and screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run truing in …
        2. Pick …
        3. See …
    validations:
      required: true
  - type: input
    id: truing
    attributes:
      label: Truing version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Your environment
      description: Operating system, Node.js version, `claude --version`.
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: The app you framed
      description: Framework and version, how it builds and how it styles. No names or private code needed.
