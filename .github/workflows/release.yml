# Publishes when a release PR lands on main (ADR 0004): the commit's subject says
# `release: v<version>`. A person merges it, and a person approves the `release`
# environment. No token is stored: npm trusted publishing uses GitHub's own identity.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/check-release.mjs "$SUBJECT"
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: make check

  publish:
    needs: gates
    runs-on: ubuntu-latest
    # A person approves this on GitHub: the gate no agent can pass.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Nothing to build, so nothing of a dependency's runs in a job that can publish.
      - run: npm publish --provenance --access public --ignore-scripts
      - run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gates.outputs.version }}
